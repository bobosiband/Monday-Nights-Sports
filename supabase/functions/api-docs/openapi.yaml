openapi: 3.1.0
info:
  title: Monday Night Sports — Backend API
  version: 0.3.0
  description: |
    Supabase Edge Functions backing Monday Night Sports.

    - Public reads: `fixtures-public`, `standings`.
    - Organiser writes (Supabase Auth JWT): `seasons`, `teams`, `match-access`.
    - Scoped scoring writes (match-token — dev stub in Sprint B):
      `scoring/:fixtureId/*`.

    Base path for every function is `/functions/v1/<function-name>`.
  contact:
    name: Monday Night Sports (COSA)
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:54321/functions/v1
    description: Local Supabase stack (default port 54321)
  - url: https://{ref}.functions.supabase.co
    description: Hosted Supabase project
    variables:
      ref:
        default: your-project-ref
        description: Your Supabase project reference

tags:
  - name: public
    description: Unauthenticated read endpoints
  - name: seasons
    description: Organiser season management
  - name: teams
    description: Organiser team management
  - name: scoring
    description: Live scoring writes (match-token gated)
  - name: match-access
    description: Mint and revoke scoped match tokens (organiser)
  - name: standings
    description: Public standings
  - name: docs
    description: Interactive API documentation

security:
  - organiserBearer: []

paths:
  # ----------------------------------------------------------------
  # fixtures-public
  # ----------------------------------------------------------------
  /fixtures-public:
    get:
      tags: [public]
      summary: Public draw for a published event
      description: |
        Renders a single event's draw as HTML (default), plain text
        (`format=text`) or JSON (`format=json`). RLS gates the underlying
        tables — unpublished events return 404.
      security: []
      parameters:
        - name: event
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [html, text, json]
            default: html
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema: { type: string }
            text/plain:
              schema: { type: string }
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
                  fixtures:
                    type: array
                    items: { $ref: '#/components/schemas/PublicFixture' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------
  # seasons
  # ----------------------------------------------------------------
  /seasons:
    get:
      tags: [seasons]
      summary: List seasons (organiser view)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  seasons:
                    type: array
                    items: { $ref: '#/components/schemas/Season' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [seasons]
      summary: Create a season
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSeasonBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  season: { $ref: '#/components/schemas/Season' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /seasons/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    get:
      tags: [seasons]
      summary: Get one season
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  season: { $ref: '#/components/schemas/Season' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [seasons]
      summary: Update a season (sparse)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSeasonBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  season: { $ref: '#/components/schemas/Season' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /seasons/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    post:
      tags: [seasons]
      summary: Mark this season active (unsets any other active)
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /seasons/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    post:
      tags: [seasons]
      summary: Archive a season (soft-delete; clears is_active)
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------
  # teams
  # ----------------------------------------------------------------
  /teams:
    get:
      tags: [teams]
      summary: List teams for a season
      parameters:
        - name: season
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [teams]
      summary: Create a team in a season
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /teams/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    patch:
      tags: [teams]
      summary: Rename a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [teams]
      summary: Remove a team
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/bulk:
    post:
      tags: [teams]
      summary: Bulk-add teams from a pasted list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [season_id, names]
              properties:
                season_id: { type: string, format: uuid }
                names:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }
                  skipped_duplicates_in_input:
                    type: array
                    items: { type: string }
                  skipped_existing_in_season:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ----------------------------------------------------------------
  # scoring — match-token gated (Sprint B; guard is a dev stub)
  # ----------------------------------------------------------------
  /scoring/{fixtureId}/start:
    parameters:
      - $ref: '#/components/parameters/FixtureIdPath'
    post:
      tags: [scoring]
      security: [{ matchToken: [] }]
      summary: Mark scoring underway (scheduled → live)
      responses:
        '200':
          description: OK — includes derived score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DerivedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scoring/{fixtureId}/events:
    parameters:
      - $ref: '#/components/parameters/FixtureIdPath'
    post:
      tags: [scoring]
      security: [{ matchToken: [] }]
      summary: Record a match event (score, foul, card, timeout, note)
      description: |
        Client supplies the event UUID; server does
        `insert ... on conflict (id) do nothing`. Response echoes the
        `inserted` flag so an optimistic client can distinguish a
        genuine write from a replay. Also flips `fixtures.status='live'`
        on the first accepted event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordEventBody' }
      responses:
        '201':
          description: Created (new event inserted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEventResponse' }
        '200':
          description: OK (replay — event id already existed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordEventResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scoring/{fixtureId}/undo:
    parameters:
      - $ref: '#/components/parameters/FixtureIdPath'
    post:
      tags: [scoring]
      security: [{ matchToken: [] }]
      summary: Soft-void a specific match event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id]
              properties:
                event_id: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DerivedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scoring/{fixtureId}/period:
    parameters:
      - $ref: '#/components/parameters/FixtureIdPath'
    post:
      tags: [scoring]
      security: [{ matchToken: [] }]
      summary: Record period_start / period_end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, period]
              properties:
                intent:
                  type: string
                  enum: [start, end]
                period:
                  type: integer
                  minimum: 1
                match_clock_ms:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DerivedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: |
            Ending a period that never opened (or already ended), or
            trying to change period boundaries on a completed/cancelled
            fixture.

  /scoring/{fixtureId}/finalize:
    parameters:
      - $ref: '#/components/parameters/FixtureIdPath'
    post:
      tags: [scoring]
      security: [{ matchToken: [] }]
      summary: Snapshot results and set fixtures.status='complete'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                decided_by:
                  type: string
                  enum: [normal, penalties, forfeit]
                  default: normal
                reopen:
                  type: boolean
                  default: false
                  description: Required true to re-finalize an already-complete fixture.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Fixture already complete without reopen=true, or cancelled.

  # ----------------------------------------------------------------
  # match-access — Sprint C stub (mint/revoke)
  # ----------------------------------------------------------------
  /match-access:
    post:
      tags: [match-access]
      summary: Mint a scoped match token
      description: Skeleton — real implementation in story #37. Returns 501 for now.
      responses:
        '501': { description: Not implemented }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /match-access/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    post:
      tags: [match-access]
      summary: Revoke a minted match token
      responses:
        '501': { description: Not implemented }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------
  # standings — Sprint E stub
  # ----------------------------------------------------------------
  /standings:
    get:
      tags: [standings]
      security: []
      summary: Public standings for a season, grouped by sport
      description: Skeleton — real computation in story #43/#44.
      parameters:
        - name: season
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  season: { type: string, format: uuid }
                  standings_by_sport:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: '#/components/schemas/StandingsRow' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ----------------------------------------------------------------
  # api-docs
  # ----------------------------------------------------------------
  /api-docs:
    get:
      tags: [docs]
      security: []
      summary: Interactive Swagger UI
      responses:
        '200':
          description: HTML page rendering this spec.
          content:
            text/html: { schema: { type: string } }

  /api-docs/openapi.yaml:
    get:
      tags: [docs]
      security: []
      summary: The OpenAPI document itself
      responses:
        '200':
          description: This YAML document.
          content:
            application/yaml: { schema: { type: string } }

# ==================================================================
components:
  securitySchemes:
    organiserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth JWT for organiser writes (seasons, teams, match-access).
    matchToken:
      type: http
      scheme: bearer
      description: |
        Scoped match token — Sprint B is a dev-mode pass-through that
        accepts any non-empty bearer string. Sprint C (story #38)
        replaces this with a real signed JWT or `match_access` lookup.

  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FixtureIdPath:
      name: fixtureId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid or malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing / invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Credentials valid but not for this resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request contradicts current server state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Season:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sports:
          type: array
          items: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        is_active: { type: boolean }
        is_archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSeasonBody:
      type: object
      required: [name, sports, starts_on, ends_on]
      properties:
        name: { type: string }
        sports:
          type: array
          items: { type: string }
          minItems: 1
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        is_active: { type: boolean, default: false }

    UpdateSeasonBody:
      type: object
      properties:
        name: { type: string }
        sports:
          type: array
          items: { type: string }
          minItems: 1
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }

    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        season_id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }

    CreateTeamBody:
      type: object
      required: [season_id, name]
      properties:
        season_id: { type: string, format: uuid }
        name: { type: string }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_date: { type: string, format: date }
        is_published: { type: boolean }
        seasons:
          type: object
          properties:
            name: { type: string }

    PublicFixture:
      type: object
      properties:
        id: { type: string, format: uuid }
        sport: { type: string }
        status:
          type: string
          enum: [scheduled, live, complete, cancelled]
        slots:
          type: object
          nullable: true
          properties:
            slot_number: { type: integer }
            starts_at: { type: string }
            pitch: { type: string, nullable: true }
        home_team:
          type: object
          nullable: true
          properties:
            name: { type: string }
        away_team:
          type: object
          nullable: true
          properties:
            name: { type: string }

    RecordEventBody:
      type: object
      required: [id, type]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [score, foul, card, timeout, note]
        team_id:
          type: string
          format: uuid
          nullable: true
        player_id:
          type: string
          format: uuid
          nullable: true
        value:
          type: integer
          minimum: 1
          nullable: true
        period:
          type: integer
          minimum: 0
          nullable: true
        match_clock_ms:
          type: integer
          minimum: 0
          nullable: true

    DerivedScore:
      type: object
      required: [home, away, foulsByTeam, currentPeriod]
      properties:
        home: { type: integer, minimum: 0 }
        away: { type: integer, minimum: 0 }
        foulsByTeam:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        currentPeriod:
          type: integer
          nullable: true

    DerivedResponse:
      type: object
      required: [fixture_id, fixture_status, derived]
      properties:
        fixture_id: { type: string, format: uuid }
        fixture_status:
          type: string
          enum: [scheduled, live, complete, cancelled]
        derived: { $ref: '#/components/schemas/DerivedScore' }

    RecordEventResponse:
      allOf:
        - $ref: '#/components/schemas/DerivedResponse'
        - type: object
          required: [event_id, inserted]
          properties:
            event_id: { type: string, format: uuid }
            inserted: { type: boolean }

    PeriodBreakdown:
      type: object
      required: [period, home, away]
      properties:
        period: { type: integer, minimum: 1 }
        home: { type: integer, minimum: 0 }
        away: { type: integer, minimum: 0 }

    FinalizeResponse:
      allOf:
        - $ref: '#/components/schemas/DerivedResponse'
        - type: object
          required: [result]
          properties:
            result:
              type: object
              required: [home_score, away_score, periods, decided_by]
              properties:
                home_score: { type: integer, minimum: 0 }
                away_score: { type: integer, minimum: 0 }
                periods:
                  type: array
                  items: { $ref: '#/components/schemas/PeriodBreakdown' }
                decided_by:
                  type: string
                  enum: [normal, penalties, forfeit]

    StandingsRow:
      type: object
      properties:
        team_id: { type: string, format: uuid }
        team_name: { type: string }
        played: { type: integer }
        won: { type: integer }
        drawn: { type: integer }
        lost: { type: integer }
        goals_for: { type: integer }
        goals_against: { type: integer }
        goal_diff: { type: integer }
        points: { type: integer }
